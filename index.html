<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DR3iARCHiVE</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <div id="app">
        <main class="main-view">
            <header class="top-nav glass-panel">
                <button id="back-btn" class="hidden icon-btn" aria-label="Zurück">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
                </button>
                <h2 id="view-title">DR3iARCHiVE</h2>
                <div class="header-actions">
                    <button id="search-toggle-btn" class="icon-btn" aria-label="Suchen">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </button>
                    <button id="settings-toggle-btn" class="icon-btn" aria-label="Einstellungen">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                    </button>
                </div>
            </header>

            <div id="search-bar" class="search-bar-container">
                <input type="text" id="search-input" placeholder="Folgen suchen..." autocomplete="off">
            </div>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Lade Episoden...</p>
            </div>

            <!-- Home: Album Grid -->
            <div id="albums-view" class="view active fade-in">
                <section id="history-section" class="hidden">
                    <h3 class="section-title">Zuletzt gehört</h3>
                    <div class="history-scroll" id="history-scroll"></div>
                </section>
                <section>
                    <h3 class="section-title">Alle Folgen</h3>
                    <div class="albums-grid" id="albums-grid"></div>
                </section>
            </div>

            <!-- Album Detail View -->
            <div id="album-detail-view" class="view">
                <div class="album-header">
                    <div class="album-cover-large skeleton" id="detail-cover"></div>
                    <div class="album-info">
                        <span class="album-type">Hörspiel</span>
                        <h1 id="detail-title">Album Title</h1>
                        <p class="album-meta" id="detail-meta">DiE DR3i</p>
                    </div>
                </div>
                
                <div class="album-description-container">
                    <p id="detail-description" class="album-description"></p>
                    <p id="detail-duration" class="album-duration"></p>
                </div>

                <div class="album-actions">
                    <button id="play-album-btn" class="btn-play-large">
                        <svg viewBox="0 0 24 24" fill="black" width="28" height="28"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    
                    <div class="download-controls">
                        <select id="download-format" class="format-select">
                            <option value="mp3">MP3</option>
                            <option value="flac">FLAC</option>
                        </select>
                        <button id="download-album-btn" class="btn-secondary">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                            ZIP
                        </button>
                        <button id="cancel-download-btn" class="btn-cancel-download hidden" aria-label="Abbrechen">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                        </button>
                        <div id="download-progress" class="hidden download-status">Lade...</div>
                    </div>
                </div>
                <ul class="track-list" id="track-list"></ul>
            </div>
        </main>

        <!-- Bottom Mini Player -->
        <div id="bottom-player" class="glass-panel">
            <div class="progress-bar-container">
                <span id="time-current" class="time-label">0:00</span>
                <input type="range" id="progress-slider" min="0" max="100" value="0">
                <span id="time-total" class="time-label">0:00</span>
            </div>

            <div class="player-main-row">
                <div class="player-now-playing">
                    <div class="player-cover skeleton" id="player-cover"></div>
                    <div class="player-info">
                        <div class="player-title" id="player-title">Wähle einen Track</div>
                        <div class="player-artist" id="player-artist">DR3iARCHiVE</div>
                    </div>
                </div>
                
                <div class="player-controls-container">
                    <div class="player-controls">
                        <button id="speed-btn" class="text-btn" aria-label="Wiedergabegeschwindigkeit">1x</button>
                        <button id="prev-btn" class="icon-btn">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                        </button>
                        <button id="play-pause-btn" class="btn-play-circle">
                            <svg id="icon-play" viewBox="0 0 24 24" fill="black" width="24" height="24"><path d="M8 5v14l11-7z"/></svg>
                            <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" fill="black" width="24" height="24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>
                        <button id="next-btn" class="icon-btn">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                        <button id="sleep-btn" class="icon-btn" aria-label="Sleep Timer" style="opacity: 0.7;">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                            <span id="sleep-badge" class="badge hidden"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Fullscreen Player -->
        <div id="fullscreen-player" class="fullscreen-panel">
            <div class="fs-bg" id="fs-bg"></div>
            <div class="fs-content">
                <header class="fs-header">
                    <button id="fs-close-btn" class="icon-btn">
                        <svg viewBox="0 0 24 24" fill="white" width="32" height="32"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                    </button>
                    <div class="fs-header-text">Läuft gerade</div>
                    <div style="width: 40px;"></div> <!-- spacer -->
                </header>

                <div class="fs-cover-container">
                    <div class="fs-cover" id="fs-cover"></div>
                </div>

                <div class="fs-info-controls">
                    <div class="fs-info">
                        <h2 id="fs-title">Track Title</h2>
                        <h3 id="fs-artist">DR3iARCHiVE</h3>
                    </div>

                    <div class="fs-progress-container">
                        <input type="range" id="fs-progress-slider" min="0" max="100" value="0">
                        <div class="fs-time-labels">
                            <span id="fs-time-current">0:00</span>
                            <span id="fs-time-total">0:00</span>
                        </div>
                    </div>

                    <div class="fs-controls">
                        <button id="fs-speed-btn" class="text-btn">1x</button>
                        <button id="fs-prev-btn" class="icon-btn large-btn">
                            <svg viewBox="0 0 24 24" fill="white" width="40" height="40"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                        </button>
                        <button id="fs-play-pause-btn" class="btn-play-circle huge">
                            <svg id="fs-icon-play" viewBox="0 0 24 24" fill="black" width="36" height="36"><path d="M8 5v14l11-7z"/></svg>
                            <svg id="fs-icon-pause" class="hidden" viewBox="0 0 24 24" fill="black" width="36" height="36"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>
                        <button id="fs-next-btn" class="icon-btn large-btn">
                            <svg viewBox="0 0 24 24" fill="white" width="40" height="40"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                        <button id="fs-sleep-btn" class="icon-btn">
                            <svg viewBox="0 0 24 24" fill="white" width="28" height="28"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                            <span id="fs-sleep-badge" class="badge hidden"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sleep Timer Modal -->
    <div id="sleep-modal" class="modal hidden">
        <div class="modal-content glass-panel">
            <h3>Sleep Timer</h3>
            <div class="timer-options">
                <button data-time="0">Aus</button>
                <button data-time="15">15 Min</button>
                <button data-time="30">30 Min</button>
                <button data-time="45">45 Min</button>
                <button data-time="60">60 Min</button>
                <div class="custom-timer-row">
                    <input type="number" id="custom-sleep-input" placeholder="Eigene (Min)" min="1" max="999">
                    <button id="custom-sleep-btn">Start</button>
                </div>
            </div>
            <button id="close-sleep-modal" class="btn-cancel">Abbrechen</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content glass-panel">
            <h3>Einstellungen</h3>
            <div class="settings-section">
                <label>Theme Farbe</label>
                <div class="color-picker-container">
                    <button class="color-btn" style="background: #1db954" data-color="#1db954" data-hover="#1ed760"></button>
                    <button class="color-btn" style="background: #e91e63" data-color="#e91e63" data-hover="#ff4081"></button>
                    <button class="color-btn" style="background: #2196f3" data-color="#2196f3" data-hover="#64b5f6"></button>
                    <button class="color-btn" style="background: #ff9800" data-color="#ff9800" data-hover="#ffb74d"></button>
                    <button class="color-btn" style="background: #9c27b0" data-color="#9c27b0" data-hover="#ba68c8"></button>
                </div>
            </div>
            <button id="close-settings-modal" class="btn-cancel">Schließen</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
